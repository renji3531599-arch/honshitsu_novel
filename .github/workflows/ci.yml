name: ci
on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci || npm i
      - run: node tools/vncheck.mjs
      - run: node tools/smoke.mjs
