<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まだ地図の途中で 〜✝本質✝特別編〜</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ============ ゲーム本体 ============ -->
  <div id="game">
    <div id="stage">
      <div id="mood-layer"></div>
      <div id="sprites"></div>
      <div id="grain"></div>
      <div id="vignette"></div>
      <div id="cg-layer"></div>
      <div id="plate"></div>
      <div id="click-catcher"></div>

      <!-- テキストウィンドウ -->
      <div id="textbox">
        <div id="nameplate"></div>
        <div id="maintext"></div>
        <div id="next-arrow">▼</div>
      </div>

      <!-- コントロール -->
      <div id="control-bar">
        <button id="btn-auto">AUTO</button>
        <button id="btn-skip">SKIP</button>
        <button id="btn-log">LOG</button>
        <button id="btn-save">SAVE</button>
        <button id="btn-load">LOAD</button>
        <button id="btn-menu">MENU</button>
      </div>

      <!-- 選択肢 -->
      <div id="choices"></div>

      <!-- 章タイトルカード -->
      <div id="chapter-card"></div>

      <!-- 掲示板/LINE -->
      <div id="board-overlay"></div>

      <!-- 心ポイント -->
      <div id="heart-pulse"></div>

      <!-- HUB -->
      <div id="hub-screen"></div>

      <!-- エンドカード -->
      <div id="end-card"></div>

      <!-- スタッフロール -->
      <div id="staffroll"></div>
    </div>
  </div>

  <!-- ============ タイトル画面 ============ -->
  <div id="title-screen" class="screen title-screen">
    <div class="title-contour"></div>
    <div class="title-inner">
      <div class="title-kasumi">桐葉高校理数科三年B組・卒業前　ノベルゲーム</div>
      <h1 class="title-logo">まだ地図の<span class="tl-accent">途中</span>で</h1>
      <div class="title-sub">〜✝本質✝特別編〜</div>
      <div class="title-cross">✝</div>
      <div class="title-menu">
        <button id="btn-new" class="tm-btn">―　はじめから</button>
        <button id="btn-continue" class="tm-btn">―　つづきから</button>
        <button id="btn-gallery" class="tm-btn">―　ギャラリー</button>
        <button id="btn-endlist" class="tm-btn">―　エンディング</button>
        <button id="btn-dict" class="tm-btn">―　✝本質✝辞典</button>
        <button id="btn-config" class="tm-btn">―　設定</button>
        <button id="btn-bonus" class="tm-btn bonus" style="display:none">―　また、この教室で</button>
      </div>
      <div class="title-foot">地面は、忘れない。／ プレイ時間目安：本編6時間超・仮画像仕様</div>
    </div>
  </div>

  <!-- ============ ログ ============ -->
  <div id="log-screen" class="screen modal">
    <div class="modal-box wide">
      <div class="modal-head"><span>バックログ</span><button class="close-btn" data-close>×　閉じる</button></div>
      <div id="log-entries" class="modal-body"></div>
    </div>
  </div>

  <!-- ============ セーブ/ロード ============ -->
  <div id="save-screen" class="screen modal">
    <div class="modal-box">
      <div class="modal-head"><span id="save-title">セーブ</span><button class="close-btn" data-close>×　閉じる</button></div>
      <div id="save-slots" class="modal-body slots"></div>
    </div>
  </div>

  <!-- ============ 設定 ============ -->
  <div id="config-screen" class="screen modal">
    <div class="modal-box">
      <div class="modal-head"><span>設定</span><button class="close-btn" data-close>×　閉じる</button></div>
      <div class="modal-body config-body">
        <div class="cfg-row"><label>文字表示速度</label><input type="range" id="cfg-speed" min="4" max="70" step="1"><span id="speed-val" class="cfg-val"></span></div>
        <div class="cfg-row"><label>オート速度</label><input type="range" id="cfg-auto" min="0.4" max="4" step="0.1"><span id="auto-val" class="cfg-val"></span></div>
        <div class="cfg-row"><label>BGM音量</label><input type="range" id="cfg-bgm" min="0" max="1" step="0.05"></div>
        <div class="cfg-row"><label>SE音量</label><input type="range" id="cfg-se" min="0" max="1" step="0.05"></div>
        <div class="cfg-row"><label>仮画像演出スタイル</label>
          <label class="cfg-check"><input type="checkbox" id="cfg-ph">白紙アセットを「舞台札スタイル」で演出する<br><small>（本番画像を assets/ に同名で入れると自動で切り替わります）</small></label>
        </div>
        <div class="cfg-note">操作：クリック/Space=進む　Ctrl=スキップ　A=オート　L=ログ　Esc=メニュー</div>
      </div>
    </div>
  </div>

  <!-- ============ ギャラリー ============ -->
  <div id="gallery-screen" class="screen modal">
    <div class="modal-box wide">
      <div class="modal-head"><span>ギャラリー</span><button class="close-btn" data-close>×　閉じる</button></div>
      <div class="modal-body">
        <div id="gallery-grid" class="gallery-grid"></div>
      </div>
    </div>
    <div id="gallery-view" class="gallery-view"></div>
  </div>

  <!-- ============ ED一覧 ============ -->
  <div id="endlist-screen" class="screen modal">
    <div class="modal-box">
      <div class="modal-head"><span>エンディング一覧</span><button class="close-btn" data-close>×　閉じる</button></div>
      <div class="modal-body">
        <div id="endlist-items"></div>
        <div id="endlist-note" class="endlist-note"></div>
      </div>
    </div>
  </div>

  <!-- ============ ✝本質✝辞典 ============ -->
  <div id="dict-screen" class="screen modal">
    <div class="modal-box">
      <div class="modal-head"><span>✝本質✝辞典</span><button class="close-btn" data-close>×　閉じる</button></div>
      <div class="modal-body" id="dict-items"></div>
    </div>
  </div>

  <!-- ============ ゲーム内メニュー ============ -->
  <div id="menu-screen" class="screen modal">
    <div class="menu-box">
      <button id="menu-config" class="menu-btn">設定</button>
      <button id="menu-to-title" class="menu-btn">タイトルへ戻る</button>
      <button id="menu-close" class="menu-btn">閉じる</button>
    </div>
  </div>

  <!-- トースト -->
  <div id="toast"></div>
</div>

<!-- ゲームスクリプトデータ（順序重要） -->
<script src="js/data/manifest.js"></script>
<script src="js/audio.js"></script>
<script src="js/data/10_prologue.js"></script>
<script src="js/data/20_routeA.js"></script>
<script src="js/data/21_routeB.js"></script>
<script src="js/data/22_routeC.js"></script>
<script src="js/data/23_routeD.js"></script>
<script src="js/data/24_routeE.js"></script>
<script src="js/data/25_routeF.js"></script>
<script src="js/data/30_convergence.js"></script>
<script src="js/data/31_climax.js"></script>
<script src="js/data/40_endings.js"></script>
<script src="js/data/45_bonus.js"></script>
<script src="js/engine.js"></script>
<script>window.addEventListener('DOMContentLoaded', function(){ VN.boot(); });</script>
</body>
</html>
